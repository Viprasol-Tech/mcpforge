openapi: 3.1.0
info:
  title: Xquik API
  version: 1.0.0
paths:
  /api/v1/events:
    get:
      operationId: listXquikEvents
      summary: List Xquik event activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Event activity returned.
  /api/v1/compose:
    post:
      operationId: createXquikDraft
      summary: Create a Xquik draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Draft created.
components:
  securitySchemes:
    XquikApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - XquikApiKey: []
